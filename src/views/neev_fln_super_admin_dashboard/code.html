<body class="h-full flex flex-col font-body-md text-on-background bg-background text-body-md">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-tertiary dark:bg-tertiary h-16 flex items-center justify-between px-margin-mobile z-40 text-on-tertiary">
    <div class="flex items-center gap-4">
        <span class="material-symbols-outlined cursor-pointer active:scale-95 transition-transform" onclick="logout()" data-icon="logout">logout</span>
        <span class="font-title-lg text-title-lg font-bold tracking-tight">State Admin Portal</span>
    </div>
</header>
<main class="flex-1 overflow-y-auto px-margin-mobile py-md flex flex-col gap-md">
    <!-- District Heatmap -->
    <section class="bg-surface border border-outline-variant rounded-xl p-md shadow-sm">
        <h2 class="font-title-md text-title-md text-tertiary mb-sm">District FLN Heatmap</h2>
        <div class="flex flex-col gap-2">
            <div class="flex items-center justify-between p-2 bg-[#d4edda] rounded">
                <span class="font-label-lg">Kanpur</span> <span class="text-sm font-bold text-[#155724]">72% Pass</span>
            </div>
            <div class="flex items-center justify-between p-2 bg-[#fff3cd] rounded">
                <span class="font-label-lg">Lucknow</span> <span class="text-sm font-bold text-[#856404]">55% Pass</span>
            </div>
            <div class="flex items-center justify-between p-2 bg-error-container bg-opacity-30 border border-error rounded">
                <span class="font-label-lg">Varanasi</span> <span class="text-sm font-bold text-error">32% Pass</span>
            </div>
        </div>
    </section>

    <!-- Bulk Import -->
    <section class="bg-surface border border-outline-variant rounded-xl p-md shadow-sm text-center flex flex-col items-center">
        <span class="material-symbols-outlined text-4xl text-tertiary mb-2">upload_file</span>
        <h2 class="font-title-md text-title-md text-on-surface mb-xs">Bulk Roster Import</h2>
        <p class="text-sm text-on-surface-variant mb-md">Upload state-wide student rosters via CSV.</p>
        <button class="w-full py-2 bg-tertiary text-on-tertiary rounded-full font-label-lg shadow-md max-w-[200px]">Select CSV File</button>
    </section>
</main>
</body>
