<body class="bg-surface text-on-surface font-sans antialiased min-h-screen flex flex-col pb-24">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim text-primary dark:text-primary-fixed-dim font-title-lg text-title-lg-mobile md:font-title-lg md:text-title-lg w-full sticky top-0 z-50 border-b border-outline-variant flat no shadows flex items-center justify-between px-margin-mobile h-16 w-full hover:bg-surface-container-highest transition-colors active:scale-95 transition-transform">
<div class="flex items-center gap-md">
<button class="p-2 rounded-full hover:bg-surface-variant flex items-center justify-center transition-colors">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-title-lg text-title-lg text-primary font-bold">Neev FLN Assessor</h1>
</div>
<button class="p-2 rounded-full hover:bg-surface-variant flex items-center justify-center transition-colors">
<span class="material-symbols-outlined" data-icon="sync">sync</span>
</button>
</header>
<!-- Status Bar -->
<div class="bg-surface-container-low px-margin-mobile py-sm flex justify-between items-center text-label-md font-label-md text-on-surface-variant border-b border-surface-container">
<div class="flex items-center gap-xs">
<span class="w-2 h-2 rounded-full bg-success"></span>
<span>Online</span>
</div>
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]" data-icon="cloud_sync">cloud_sync</span>
<span>3 Pending Syncs</span>
</div>
</div>
<!-- Main Content Canvas -->
<main class="flex-grow px-margin-mobile pt-lg pb-xl flex flex-col gap-xl">
<!-- Module Selection Segmented Control -->
<section class="flex bg-surface-container p-1 rounded-full w-full mx-auto max-w-md">
<button class="flex-1 py-sm px-md rounded-full bg-primary-container text-on-primary-container font-label-lg text-label-lg transition-colors shadow-sm text-center">
                Literacy (Hindi/English)
            </button>
<button class="flex-1 py-sm px-md rounded-full text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-container-highest transition-colors text-center">
                Numeracy
            </button>
</section>
<!-- Selection Form (Card Style) -->
<section class="bg-surface rounded-2xl border border-surface-container-highest p-lg shadow-sm flex flex-col gap-lg w-full max-w-md mx-auto">
<h2 class="font-title-md text-title-md text-on-surface">Assessment Setup</h2>
<div class="flex flex-col gap-md">
<!-- Select District -->
<div class="relative">
<label class="absolute -top-2 left-3 bg-surface px-1 text-label-md font-label-md text-on-surface-variant z-10" for="district">Select District</label>
<select class="w-full bg-surface border border-outline-variant rounded-lg px-md py-sm text-body-lg font-body-lg text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" id="district">
<option disabled="" selected="" value="">Choose a district...</option>
<option value="d1">District Alpha</option>
<option value="d2">District Beta</option>
</select>
</div>
<!-- Select School -->
<div class="relative mt-2">
<label class="absolute -top-2 left-3 bg-surface px-1 text-label-md font-label-md text-on-surface-variant z-10" for="school">Select School</label>
<select class="w-full bg-surface border border-outline-variant rounded-lg px-md py-sm text-body-lg font-body-lg text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" id="school">
<option disabled="" selected="" value="">Choose a school...</option>
<option value="s1">Govt. Primary School 1</option>
<option value="s2">Govt. Primary School 2</option>
</select>
</div>
<!-- Select Grade -->
<div class="relative mt-2">
<label class="absolute -top-2 left-3 bg-surface px-1 text-label-md font-label-md text-on-surface-variant z-10" for="grade">Select Grade</label>
<select class="w-full bg-surface border border-outline-variant rounded-lg px-md py-sm text-body-lg font-body-lg text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" id="grade">
<option disabled="" selected="" value="">Choose a grade...</option>
<option value="g1">Grade 1</option>
<option value="g2">Grade 2</option>
<option value="g3">Grade 3</option>
</select>
</div>
<!-- Select Student -->
<div class="relative mt-2">
<label class="absolute -top-2 left-3 bg-surface px-1 text-label-md font-label-md text-on-surface-variant z-10" for="student">Select Student</label>
<select class="w-full bg-surface border border-outline-variant rounded-lg px-md py-sm text-body-lg font-body-lg text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors" id="student">
<option disabled="" selected="" value="">Choose a student...</option>
<option value="st1">Aarav Patel</option>
<option value="st2">Diya Sharma</option>
<option value="st3">Rohan Kumar</option>
</select>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-20 left-0 right-0 p-margin-mobile bg-gradient-to-t from-surface via-surface to-transparent z-40 md:hidden flex justify-center">
<button class="w-full max-w-md bg-success hover:bg-emerald-500 text-on-success font-title-md text-title-md py-md rounded-full shadow-sm transition-transform active:scale-95 flex items-center justify-center gap-sm">
<span class="material-symbols-outlined" data-icon="play_arrow">play_arrow</span>
            Start Assessment Session
        </button>
</div>
<!-- Desktop Action Area (Hidden on mobile) -->
<div class="hidden md:flex justify-center px-margin-desktop pb-xl">
<button class="w-full max-w-md bg-success hover:bg-emerald-500 text-on-success font-title-md text-title-md py-md rounded-full shadow-sm transition-transform active:scale-95 flex items-center justify-center gap-sm">
<span class="material-symbols-outlined" data-icon="play_arrow">play_arrow</span>
            Start Assessment Session
        </button>
</div>
<!-- BottomNavBar (Semantic Match: Dashboard) -->
<nav class="bg-surface-container dark:bg-surface-container-low text-primary dark:text-primary-fixed-dim font-label-md text-label-md font-title-lg text-title-lg text-primary fixed bottom-0 w-full z-50 h-20 bg-surface-container flat no shadows hover:bg-surface-container-highest ripple-effect active:scale-90 flex justify-around items-center w-full px-base pb-safe md:hidden">
<!-- Dashboard (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 min-w-[64px]">
<span class="material-symbols-outlined icon-fill" data-icon="dashboard" data-weight="fill">dashboard</span>
<span class="mt-1">Dashboard</span>
</button>
<!-- Assessments -->
<button class="flex flex-col items-center justify-center text-on-surface-variant min-w-[64px]">
<span class="material-symbols-outlined" data-icon="assignment">assignment</span>
<span class="mt-1">Assessments</span>
</button>
<!-- History -->
<button class="flex flex-col items-center justify-center text-on-surface-variant min-w-[64px]">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="mt-1">History</span>
</button>
</nav>
