<style>
        body {
            background-color: #f9f9f9;
        }
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom Select Styling */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2341474e%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="h-full flex flex-col font-body-md text-on-background bg-slate-50 text-body-md antialiased min-h-screen">
  <!-- Top Navigation Bar -->
  <header class="w-full top-0 sticky bg-slate-900/90 backdrop-blur-md text-white h-16 flex items-center justify-between px-4 md:px-8 border-b border-slate-700/50 z-50 shadow-md">
    <div class="flex items-center gap-3">
      <img src="assets/images/neev_logo.png" alt="NEEV" class="h-9 w-auto object-contain" />
      <span class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
        NEEV <span class="text-xs bg-teal-500/20 text-teal-300 px-2 py-0.5 rounded-full border border-teal-500/40 font-mono">Field Assessor</span>
      </span>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="window.logout()" class="px-3.5 py-1.5 rounded-full bg-white/10 hover:bg-white/20 text-white text-xs font-medium border border-white/20 transition-all active:scale-95 flex items-center gap-1.5">
        <span class="material-symbols-outlined text-base">logout</span> Logout
      </button>
    </div>
  </header>

  <!-- Main Content Canvas -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-8 space-y-6 overflow-y-auto pb-24">
    
    <!-- Hero Banner -->
    <div class="bg-gradient-to-r from-teal-800 via-slate-800 to-slate-900 text-white rounded-3xl p-6 shadow-xl border border-teal-500/20 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-teal-400/10 border border-teal-400/30 text-teal-300 text-xs font-medium mb-3">
          <span class="material-symbols-outlined text-sm">edit_document</span> Offline Assessment Mode
        </div>
        <h1 class="text-2xl md:text-3xl font-bold tracking-tight mb-1">Field Assessment Console</h1>
        <p class="text-xs md:text-sm text-slate-300">Conduct 1-on-1 Literacy & Numeracy evaluations directly in the classroom.</p>
      </div>

      <!-- Sync Status Indicator -->
      <div class="flex items-center gap-2 bg-white/10 backdrop-blur-md px-3.5 py-2 rounded-2xl border border-white/20 text-xs text-white">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>Online & Synced</span>
      </div>
    </div>

    <!-- Main Assessment Card -->
    <div class="bg-white rounded-3xl p-6 md:p-8 border border-slate-200 shadow-md space-y-6 max-w-2xl mx-auto">
      
      <!-- Module Selection Control -->
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Assessment Subject</label>
        <div class="flex bg-slate-100 p-1.5 rounded-2xl w-full border border-slate-200">
          <button class="flex-1 py-2.5 px-4 rounded-xl bg-teal-600 text-white font-bold text-xs transition-all shadow-sm text-center flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-base">menu_book</span> Literacy (Hindi / English)
          </button>
          <button class="flex-1 py-2.5 px-4 rounded-xl text-slate-600 hover:bg-white font-medium text-xs transition-all text-center flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-base">calculate</span> Numeracy (Math)
          </button>
        </div>
      </div>

      <hr class="border-slate-100" />

      <!-- Selection Form Grid -->
      <div class="space-y-4">
        <h3 class="text-sm font-bold text-slate-800">Select Student Roster Target</h3>
        
        <!-- District -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1" for="district">District</label>
          <select id="district" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:border-teal-500 focus:ring-1 focus:ring-teal-500 outline-none transition-colors">
            <option disabled selected value="">Choose a district...</option>
            <option value="d1">Kanpur Nagar</option>
            <option value="d2">Delhi NCR</option>
          </select>
        </div>

        <!-- School -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1" for="school">School / Center</label>
          <select id="school" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:border-teal-500 focus:ring-1 focus:ring-teal-500 outline-none transition-colors">
            <option disabled selected value="">Choose a school...</option>
            <option value="s1">Govt. Primary School Kanpur</option>
            <option value="s2">Etasha Remedial Center</option>
          </select>
        </div>

        <!-- Grade -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1" for="grade">Grade / Standard</label>
          <select id="grade" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:border-teal-500 focus:ring-1 focus:ring-teal-500 outline-none transition-colors">
            <option disabled selected value="">Choose a grade...</option>
            <option value="g1">Grade 1</option>
            <option value="g2">Grade 2</option>
            <option value="g3">Grade 3</option>
          </select>
        </div>

        <!-- Student -->
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1" for="student">Student Name & Roll No.</label>
          <select id="student" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm text-slate-800 focus:border-teal-500 focus:ring-1 focus:ring-teal-500 outline-none transition-colors">
            <option disabled selected value="">Choose a student...</option>
            <option value="st1">Rohan Sharma (Roll: 101)</option>
            <option value="st2">Neha Patel (Roll: 102)</option>
          </select>
        </div>
      </div>

      <!-- Action Button -->
      <div class="pt-2">
        <button class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold text-sm py-3.5 rounded-2xl shadow-lg shadow-teal-600/20 transition-all active:scale-95 flex items-center justify-center gap-2">
          <span class="material-symbols-outlined text-lg">play_circle</span>
          Start Assessment Session
        </button>
  </main>
</body>
</html>
