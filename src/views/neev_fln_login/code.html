<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Neev FLN Assessor - Login</title>
<!-- Google Fonts: Noto Sans & Material Symbols -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#30628a",
                        "tertiary-fixed-dim": "#c6c6c7",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#41474e",
                        "surface-container-low": "#f4f3f3",

                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#9bcbf8",
                        "error": "#ba1a1a",
                        "outline": "#72787f",
                        "inverse-on-surface": "#f1f1f1",
                        "secondary-fixed-dim": "#c8c6c5",
                        "tertiary-fixed": "#e2e2e2",
                        "error-container": "#ffdad6",
                        "surface-container": "#eeeeee",
                        "tertiary": "#5d5f5f",
                        "background": "#f9f9f9",
                        "primary-container": "#a2d2ff",
                        "on-error-container": "#93000a",
                        "surface-bright": "#f9f9f9",
                        "surface": "#f9f9f9",
                        "on-primary-container": "#275b82",
                        "on-tertiary-fixed-variant": "#454747",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#555757",
                        "on-primary": "#ffffff",
                        "tertiary-container": "#cdcdcd",
                        "surface-container-high": "#e8e8e8",
                        "inverse-surface": "#2f3131",
                        "primary-fixed": "#cde5ff",
                        "secondary-fixed": "#e5e2e1",
                        "on-tertiary-fixed": "#1a1c1c",
                        "on-surface": "#1a1c1c",
                        "surface-tint": "#30628a",
                        "on-primary-fixed-variant": "#104a70",
                        "surface-container-highest": "#e2e2e2",
                        "secondary-container": "#e2dfde",
                        "surface-variant": "#e2e2e2",
                        "on-secondary-container": "#636262",
                        "secondary": "#5f5e5e",
                        "inverse-primary": "#9bcbf8",
                        "on-secondary-fixed-variant": "#474746",
                        "on-primary-fixed": "#001d32",
                        "on-secondary-fixed": "#1b1c1c",
                        "outline-variant": "#c1c7cf",
                        "on-background": "#1a1c1c"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xxl": "48px",
                        "xs": "4px",
                        "gutter": "24px",
                        "xl": "32px",
                        "base": "8px",
                        "lg": "24px",
                        "md": "16px",
                        "margin-mobile": "16px",
                        "sm": "12px",
                        "margin-desktop": "64px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Noto Sans"],
                        "body-lg": ["Noto Sans"],
                        "label-lg": ["Noto Sans"],
                        "headline-md": ["Noto Sans"],
                        "title-md": ["Noto Sans"],
                        "body-md": ["Noto Sans"],

                        "title-lg": ["Noto Sans"],

                    },
                    "fontSize": {

                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400" }],
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500" }],
                        "headline-md": ["28px", { "lineHeight": "36px", "fontWeight": "400" }],
                        "title-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400" }],
                        "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }]

                }
            }
        }

<style>
        .ambient-shadow-hover:hover {
            box-shadow: 0 4px 12px rgba(33, 33, 33, 0.04);
        }
    </style>
<style>
    body {
      min-height: 100dvh;
    }
    @media (max-height: 720px) {
      .neev-tagline {
        display: none !important;
      }
      .hero-panel {
        padding-top: 0.75rem !important;
        padding-bottom: 0.75rem !important;
      }
      .logo-box {
        margin-bottom: 0.5rem !important;
      }
      .logo-img {
        height: 3.5rem !important;
      }
      .logo-text {
        font-size: 2.25rem !important;
      }
      .login-panel {
        padding-top: 1rem !important;
        padding-bottom: 1.5rem !important;
      }
      .lang-selector-box {
        margin-bottom: 0.75rem !important;
        margin-top: 0.25rem !important;
      }
      .main-login-box {
        gap: 0.75rem !important;
      }
      .keypad-footer {
        margin-top: 0.75rem !important;
      }
    }
  </style>
  </head>
<body class="antialiased">
  <div class="min-h-full flex items-center justify-center p-2 sm:p-4 md:p-8 flex-grow bg-cover bg-center bg-no-repeat relative" style="background-image: url('assets/images/classroom_bg.png');">
    <!-- Dark overlay for better text contrast -->
    <div class="absolute inset-0 bg-black/30"></div>

    <!-- Glassmorphic Panel -->
    <div class="w-full max-w-4xl max-h-[96vh] overflow-y-auto backdrop-blur-md bg-white/10 border border-white/20 shadow-2xl rounded-[32px] flex flex-col md:flex-row relative z-10">
      
      <!-- Unified Hero Panel (Visible on Desktop & Mobile) -->
      <div class="hero-panel flex-1 p-6 md:p-8 flex flex-col items-center justify-center text-white text-center border-b md:border-b-0 md:border-r border-white/20 bg-white/5">
        <div class="logo-box flex flex-row items-end justify-center gap-3 md:gap-4 mb-3 md:mb-6">
          <!-- Exact Brand Logo Icon -->
          <img src="assets/images/neev_logo.png" alt="NEEV Logo" class="logo-img h-20 md:h-28 w-auto object-contain drop-shadow-md shrink-0" />
          <!-- NEEV Text aligned to bottom, height matching pot -->
          <h1 class="logo-text text-3xl md:text-5xl font-bold tracking-tight text-white leading-none mb-1" style="text-shadow: 0 2px 10px rgba(0,0,0,0.4);">NEEV</h1>
        </div>

        <p class="neev-tagline text-sm md:text-xl opacity-100 max-w-sm leading-relaxed" style="text-shadow: 0 1px 6px rgba(0,0,0,0.5);">Building Stronger Foundations. Tracking Brighter Futures.</p>
      </div>

      <!-- Right Login Panel -->
      <div class="login-panel flex-1 flex flex-col items-center justify-center p-5 sm:p-6 bg-white/20 backdrop-blur-xl relative z-10 pb-10">
        
        <!-- Back to Onboarding Top Link -->
        <button onclick="showView('view-neev_fln_onboarding')" class="absolute top-4 left-4 text-white/80 hover:text-white flex items-center gap-1.5 text-xs font-medium bg-white/10 hover:bg-white/20 px-3.5 py-1.5 rounded-full border border-white/20 backdrop-blur-md transition-all active:scale-95 z-20 shadow-sm">
          <span class="material-symbols-outlined text-base">arrow_back</span> <span data-i18n="onboarding">Onboarding</span>
        </button>

        <!-- Language Selector -->
        <div class="lang-selector-box w-full flex justify-end mb-5">
          <div class="flex bg-white/20 rounded-full p-1 border border-white/30 backdrop-blur-sm" id="language-selector">
            <button onclick="switchLanguage('en')" class="lang-btn px-3.5 py-1 rounded-full bg-teal-500 text-white text-xs font-medium shadow-sm transition-all" data-lang="en">English</button>
            <button onclick="switchLanguage('hi')" class="lang-btn px-3.5 py-1 rounded-full text-white hover:bg-white/20 text-xs font-medium transition-all" data-lang="hi">हिंदी</button>
            <button onclick="switchLanguage('hi_en')" class="lang-btn px-3.5 py-1 rounded-full text-white hover:bg-white/20 text-xs font-medium transition-all" data-lang="hi_en">हिंग्लिश</button>
          </div>
        </div>

        <main class="main-login-box w-full max-w-[270px] flex flex-col items-center justify-center gap-4 mt-1">
          
          <!-- Active Remember Me Profile Card (Hidden by default, shown when user is cached) -->
          <div id="remember-me-card" class="hidden w-full bg-white/15 border border-white/30 backdrop-blur-md rounded-2xl p-3.5 flex items-center justify-between shadow-md">
            <div class="flex items-center gap-3 overflow-hidden">
              <div class="w-10 h-10 rounded-full bg-teal-500 flex items-center justify-center text-white font-bold text-sm shadow-sm shrink-0" id="remember-avatar">U</div>
              <div class="truncate">
                <p class="text-xs text-white/70 font-medium leading-none mb-1">Welcome Back</p>
                <h4 class="text-sm font-bold text-white truncate" id="remember-name">User Name</h4>
                <p class="text-[11px] text-teal-300 font-mono" id="remember-userid">@userid</p>
              </div>
            </div>
            <button onclick="switchUserAccount()" class="text-xs text-white/80 hover:text-white underline text-right shrink-0 ml-2">Switch</button>
          </div>

          <!-- User ID Input Field (Shown when no active profile cached) -->
          <div id="userid-input-container" class="w-full relative">
            <label class="block font-medium text-xs text-white/90 mb-1.5 ml-1" for="user-id-input">User ID / Staff ID</label>
            <div class="relative flex items-center">
              <input type="text" id="user-id-input" placeholder="e.g. superadmin, teamlead" class="w-full bg-white/10 border border-white/40 rounded-full py-2.5 pl-4 pr-10 text-sm text-white placeholder-white/50 focus:border-white focus:ring-1 focus:ring-white transition-colors outline-none backdrop-blur-md" autocomplete="username" />
              <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-white/70">
                <span class="material-symbols-outlined text-lg">person</span>
              </div>
            </div>
          </div>

          <!-- 6-Digit PIN Entry Dots -->
          <div class="flex items-center justify-center gap-2.5 my-1">
            <div class="pin-dot w-3 h-3 rounded-full border-2 border-white/70 bg-transparent transition-colors shadow-sm"></div>
            <div class="pin-dot w-3 h-3 rounded-full border-2 border-white/70 bg-transparent transition-colors shadow-sm"></div>
            <div class="pin-dot w-3 h-3 rounded-full border-2 border-white/70 bg-transparent transition-colors shadow-sm"></div>
            <div class="pin-dot w-3 h-3 rounded-full border-2 border-white/70 bg-transparent transition-colors shadow-sm"></div>
            <div class="pin-dot w-3 h-3 rounded-full border-2 border-white/70 bg-transparent transition-colors shadow-sm"></div>
            <div class="pin-dot w-3 h-3 rounded-full border-2 border-white/70 bg-transparent transition-colors shadow-sm"></div>
          </div>
        </main>

        <!-- Numeric Keypad -->
        <footer class="keypad-footer w-full max-w-[270px] mt-5">
          <div class="grid grid-cols-3 gap-y-4 gap-x-2.5 justify-items-center">
            <!-- Row 1 -->
            <button class="w-[52px] h-[52px] rounded-full bg-white/20 hover:bg-white/30 active:scale-95 transition-all flex items-center justify-center text-white text-xl font-medium border border-white/20 backdrop-blur-sm shadow-sm">1</button>
            <button class="w-[52px] h-[52px] rounded-full bg-white/20 hover:bg-white/30 active:scale-95 transition-all flex items-center justify-center text-white text-xl font-medium border border-white/20 backdrop-blur-sm shadow-sm">2</button>
            <button class="w-[52px] h-[52px] rounded-full bg-white/20 hover:bg-white/30 active:scale-95 transition-all flex items-center justify-center text-white text-xl font-medium border border-white/20 backdrop-blur-sm shadow-sm">3</button>
            <!-- Row 2 -->
            <button class="w-[52px] h-[52px] rounded-full bg-white/20 hover:bg-white/30 active:scale-95 transition-all flex items-center justify-center text-white text-xl font-medium border border-white/20 backdrop-blur-sm shadow-sm">4</button>
            <button class="w-[52px] h-[52px] rounded-full bg-white/20 hover:bg-white/30 active:scale-95 transition-all flex items-center justify-center text-white text-xl font-medium border border-white/20 backdrop-blur-sm shadow-sm">5</button>
            <button class="w-[52px] h-[52px] rounded-full bg-white/20 hover:bg-white/30 active:scale-95 transition-all flex items-center justify-center text-white text-xl font-medium border border-white/20 backdrop-blur-sm shadow-sm">6</button>
            <!-- Row 3 -->
            <button class="w-[52px] h-[52px] rounded-full bg-white/20 hover:bg-white/30 active:scale-95 transition-all flex items-center justify-center text-white text-xl font-medium border border-white/20 backdrop-blur-sm shadow-sm">7</button>
            <button class="w-[52px] h-[52px] rounded-full bg-white/20 hover:bg-white/30 active:scale-95 transition-all flex items-center justify-center text-white text-xl font-medium border border-white/20 backdrop-blur-sm shadow-sm">8</button>
            <button class="w-[52px] h-[52px] rounded-full bg-white/20 hover:bg-white/30 active:scale-95 transition-all flex items-center justify-center text-white text-xl font-medium border border-white/20 backdrop-blur-sm shadow-sm">9</button>
            <!-- Row 4 -->
            <button class="w-[52px] h-[52px] rounded-full bg-transparent hover:bg-white/10 flex items-center justify-center text-white/90 text-xs font-medium active:opacity-70 transition-all" data-i18n="clear">Clear</button>
            <button class="w-[52px] h-[52px] rounded-full bg-white/20 hover:bg-white/30 active:scale-95 transition-all flex items-center justify-center text-white text-xl font-medium border border-white/20 backdrop-blur-sm shadow-sm">0</button>
            <button class="w-[52px] h-[52px] rounded-full bg-transparent hover:bg-white/10 flex items-center justify-center text-white/90 active:opacity-70 transition-all">
              <span class="material-symbols-outlined text-[26px] font-light">backspace</span>
            </button>
          </div>
          
          <!-- Log In Button -->
          <div class="mt-6 flex justify-center w-full">
            <button id="login-btn" onclick="triggerManualLogin()" class="w-[85%] max-w-[230px] bg-teal-500 hover:bg-teal-600 text-white font-medium py-2.5 px-5 rounded-full shadow-lg transition-all active:scale-95 text-sm" data-i18n="logIn">Log In</button>
          </div>
        </footer>
      </div>
    </div>
  </div>
</body></html>
