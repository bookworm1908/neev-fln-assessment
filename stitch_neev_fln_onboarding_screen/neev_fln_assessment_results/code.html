<style>
        .circular-progress {
            transform: rotate(-90deg);
        }
        .circular-progress circle {
            transition: stroke-dashoffset 1s ease-in-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface font-body-lg antialiased min-h-screen flex flex-col pt-[72px] pb-[160px]">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface dark:bg-inverse-surface flex flex-col justify-center px-margin-mobile h-auto py-md">
<div class="flex items-center justify-between w-full">
<button class="text-primary dark:text-inverse-primary hover:bg-surface-container-high dark:hover:bg-surface-container-highest p-2 rounded-full transition-all duration-200 active:scale-[0.98]">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-primary dark:text-inverse-primary font-bold">Assessment Results</h1>
<button class="text-primary dark:text-inverse-primary hover:bg-surface-container-high dark:hover:bg-surface-container-highest p-2 rounded-full transition-all duration-200 active:scale-[0.98]">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
</button>
</div>
</header>
<main class="flex-grow px-margin-mobile flex flex-col gap-xl">
<!-- Results Card -->
<section class="bg-surface rounded-2xl border border-secondary-fixed-dim p-lg flex flex-col items-center gap-md mt-md">
<div class="relative w-40 h-40 flex items-center justify-center">
<svg class="circular-progress w-full h-full" viewbox="0 0 100 100">
<circle class="text-surface-variant stroke-current" cx="50" cy="50" fill="transparent" r="40" stroke-width="8"></circle>
<circle class="text-primary stroke-current" cx="50" cy="50" fill="transparent" r="40" stroke-dasharray="251.2" stroke-dashoffset="50.24" stroke-linecap="round" stroke-width="8"></circle>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center text-center">
<span class="font-headline-md text-headline-md font-bold text-primary">80%</span>
<span class="font-label-md text-label-md text-on-surface-variant">Accuracy</span>
</div>
</div>
<div class="bg-[#d4edda] text-[#155724] px-4 py-2 rounded-lg border border-[#c3e6cb] flex items-center gap-2">
<span class="material-symbols-outlined text-[20px]">check_circle</span>
<span class="font-label-lg text-label-lg font-bold">NIPUN Numeracy Benchmark Met</span>
</div>
</section>
<!-- Summary Metrics Grid -->
<section class="grid grid-cols-2 gap-md">
<div class="bg-surface rounded-2xl border border-secondary-fixed-dim p-md flex flex-col gap-sm">
<span class="font-label-md text-label-md text-on-surface-variant">Number Recognition</span>
<span class="font-title-lg text-title-lg font-bold text-primary">100%</span>
</div>
<div class="bg-surface rounded-2xl border border-secondary-fixed-dim p-md flex flex-col gap-sm">
<span class="font-label-md text-label-md text-on-surface-variant">Operations Solved</span>
<span class="font-title-lg text-title-lg font-bold text-primary">4/5</span>
</div>
</section>
<!-- Details List -->
<section class="flex flex-col gap-md">
<h2 class="font-title-md text-title-md text-on-surface">Assessment Details</h2>
<div class="bg-surface rounded-2xl border border-secondary-fixed-dim overflow-hidden divide-y divide-secondary-fixed-dim">
<div class="p-md flex justify-between items-center bg-surface-bright">
<span class="font-body-lg text-body-lg text-on-surface">2 + 3 = 5</span>
<span class="material-symbols-outlined text-[#28a745]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="p-md flex justify-between items-center bg-surface-bright">
<span class="font-body-lg text-body-lg text-on-surface">7 - 4 = 3</span>
<span class="material-symbols-outlined text-[#28a745]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="p-md flex justify-between items-center bg-surface-bright">
<span class="font-body-lg text-body-lg text-on-surface">12 / 3 = 4</span>
<span class="material-symbols-outlined text-[#28a745]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="p-md flex justify-between items-center bg-error-container">
<span class="font-body-lg text-body-lg text-on-surface">24 / 4 = 5</span>
<div class="flex items-center gap-2">
<span class="font-label-md text-label-md text-error">Answered: 5</span>
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">cancel</span>
</div>
</div>
<div class="p-md flex justify-between items-center bg-surface-bright">
<span class="font-body-lg text-body-lg text-on-surface">5 x 5 = 25</span>
<span class="material-symbols-outlined text-[#28a745]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</section>
</main>
<!-- Bottom Actions -->
<div class="fixed bottom-[80px] left-0 w-full px-margin-mobile py-md bg-gradient-to-t from-surface to-transparent z-40">
<button class="w-full bg-primary-container text-on-background font-label-lg text-label-lg font-bold py-4 rounded-full shadow-sm hover:shadow-md transition-shadow">
            Save &amp; Submit Assessment
        </button>
</div>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 px-4 pb-safe bg-surface-container dark:bg-surface-container-high rounded-t-xl">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-secondary-container hover:bg-surface-variant dark:hover:bg-inverse-surface rounded-full p-2 transition-transform duration-150 active:scale-95 w-16">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-md text-label-md mt-1">Home</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-1 transition-transform duration-150 active:scale-95 w-16">
<span class="material-symbols-outlined" data-icon="task" style="font-variation-settings: 'FILL' 1;">task</span>
<span class="font-label-md text-label-md mt-1 font-bold">Assessments</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-secondary-container hover:bg-surface-variant dark:hover:bg-inverse-surface rounded-full p-2 transition-transform duration-150 active:scale-95 w-16">
<span class="material-symbols-outlined" data-icon="groups">groups</span>
<span class="font-label-md text-label-md mt-1">Students</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-secondary-container hover:bg-surface-variant dark:hover:bg-inverse-surface rounded-full p-2 transition-transform duration-150 active:scale-95 w-16">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-md text-label-md mt-1">Profile</span>
</button>
</nav>
</body></html>
