    <!-- Top App Bar -->

        <div class="flex items-center gap-md">
            <button aria-label="Go back" class="p-2 rounded-full hover:bg-surface-container-high transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">

            </button>
            <h1 class="font-title-lg text-title-lg text-on-surface">Register New School</h1>
        </div>
    </header>

    <!-- Main Content Canvas -->
    <main class="flex-grow flex flex-col justify-start px-margin-mobile py-lg w-full max-w-2xl mx-auto md:px-0">
        
        <form class="flex flex-col gap-lg bg-surface p-lg rounded-xl border border-outline-variant shadow-sm w-full">
            
            <div class="flex flex-col gap-base">
                <p class="font-body-md text-body-md text-on-surface-variant">Enter school details below to add them to the assessment database.</p>
            </div>

            <!-- School Name Field -->
            <div class="relative">
                <label for="school-name" class="block font-label-md text-label-md text-on-surface mb-xs ml-1">School Name</label>
                <div class="relative flex items-center">
                    <span class="material-symbols-outlined absolute left-sm text-outline pointer-events-none" aria-hidden="true" data-icon="school">school</span>
                    <input type="text" id="school-name" name="school-name" placeholder="e.g. Govt. Primary School, HSR Layout" required="" class="w-full pl-[44px] pr-md py-sm bg-surface rounded-lg border border-outline-variant text-on-surface font-body-lg text-body-lg placeholder-on-surface-variant focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors">
                </div>
            </div>

            <!-- UDISE Code Field -->
            <div class="relative">
                <label for="udise-code" class="block font-label-md text-label-md text-on-surface mb-xs ml-1">UDISE Code (Numeric ID)</label>
                <div class="relative flex items-center">
                    <span class="material-symbols-outlined absolute left-sm text-outline pointer-events-none" aria-hidden="true" data-icon="pin">pin</span>
                    <input type="text" inputmode="numeric" pattern="[0-9]*" id="udise-code" name="udise-code" placeholder="11-digit code" required="" class="w-full pl-[44px] pr-md py-sm bg-surface rounded-lg border border-outline-variant text-on-surface font-body-lg text-body-lg placeholder-on-surface-variant focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors">
                </div>
            </div>

            <!-- Cluster Field -->
            <div class="relative">
<label class="block font-label-md text-label-md text-on-surface mb-xs ml-1" for="school-category">School Category</label>
<div class="relative flex items-center">
<span aria-hidden="true" class="material-symbols-outlined absolute left-sm text-outline pointer-events-none" data-icon="category">category</span>
<select class="w-full pl-[44px] pr-md py-sm bg-surface rounded-lg border border-outline-variant text-on-surface font-body-lg text-body-lg placeholder-on-surface-variant focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors appearance-none" id="school-category" name="school-category" required="">
<option disabled="" selected="" value="">Tap to select category...</option>
<option value="primary">Primary</option>
<option value="upper-primary">Upper Primary</option>
<option value="secondary">Secondary</option>
<option value="higher-secondary">Higher Secondary</option>
</select>
<span aria-hidden="true" class="material-symbols-outlined absolute right-sm text-outline pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div><div class="relative">
                <label for="cluster" class="block font-label-md text-label-md text-on-surface mb-xs ml-1">Cluster</label>
                <div class="relative flex items-center">
                    <span class="material-symbols-outlined absolute left-sm text-outline pointer-events-none" aria-hidden="true" data-icon="account_tree" data-original-icon="account_tree">circle</span>
                    <input type="text" id="cluster" name="cluster" placeholder="e.g. North Cluster" required="" class="w-full pl-[44px] pr-md py-sm bg-surface rounded-lg border border-outline-variant text-on-surface font-body-lg text-body-lg placeholder-on-surface-variant focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-lg w-full">
                <!-- Block Field -->
                <div class="relative w-full">
                    <label for="block" class="block font-label-md text-label-md text-on-surface mb-xs ml-1">Block</label>
                    <div class="relative flex items-center">
                        <span class="material-symbols-outlined absolute left-sm text-outline pointer-events-none" aria-hidden="true" data-icon="location_city" data-original-icon="location_city">circle</span>
                        <input type="text" id="block" name="block" placeholder="Enter Block" required="" class="w-full pl-[44px] pr-md py-sm bg-surface rounded-lg border border-outline-variant text-on-surface font-body-lg text-body-lg placeholder-on-surface-variant focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors">
                    </div>
                </div>

                <!-- District Field -->
                <div class="relative w-full">
                    <label for="district" class="block font-label-md text-label-md text-on-surface mb-xs ml-1">District</label>
                    <div class="relative flex items-center">
                        <span class="material-symbols-outlined absolute left-sm text-outline pointer-events-none" aria-hidden="true" data-icon="map">map</span>
                        <input type="text" id="district" name="district" placeholder="Enter District" required="" class="w-full pl-[44px] pr-md py-sm bg-surface rounded-lg border border-outline-variant text-on-surface font-body-lg text-body-lg placeholder-on-surface-variant focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors">
                    </div>
                </div>
            </div>

            <!-- Action Area -->
            <div class="mt-lg pt-lg border-t border-outline-variant flex flex-col gap-md">
                <button type="submit" class="w-full bg-primary-container text-on-primary-container font-title-md text-title-md py-sm px-lg rounded-full hover:bg-inverse-primary hover:shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all flex items-center justify-center gap-sm">
                    </button></div></form></main></body></html>
